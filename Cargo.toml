[package]
name = "zenv-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Container-based development environments"
license = "MIT"
repository = "https://github.com/zueve/zenv"
readme = "README.md"

[lib]
name = "zenv"

[[bin]]
name = "zenv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
dotenvy = "0.15"
rustix = { version = "1", features = ["process"] }
thiserror = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
